<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101010"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Analog Image"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png"><title>Analog Image Processor</title><style>
:root{color-scheme:dark;font-family:ui-monospace,Menlo,Consolas,monospace;background:#101010;color:#f3f3f3}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:940px;margin:auto;padding:20px 17px 65px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #383838;padding-bottom:16px}h1{font-size:19px;letter-spacing:.09em;margin:0}h2{font-size:12px;letter-spacing:.14em;font-weight:500;margin:24px 0 13px}.sub,.muted{color:#aaa;font-size:11px;line-height:1.65}.tag{border:1px solid #555;padding:6px 9px;font-size:10px;letter-spacing:.06em}.upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.btn,.filebtn{background:#f2f2f2;color:#111;border:1px solid #f2f2f2;padding:12px 14px;font-size:12px;font-weight:700}.btn.secondary{background:transparent;color:#eee;border-color:#777}.filebtn input{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.effect{border:0;background:none;color:inherit;padding:0;text-align:left;min-width:0}.thumb{aspect-ratio:1.28;background:#202020;border:1px solid #333;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb canvas{width:100%;height:100%;object-fit:cover}.effect .name{font-size:11px;letter-spacing:.03em;margin-top:8px;display:flex;gap:10px;align-items:baseline}.effect .num{color:#777}.effect.active .thumb{border:2px solid #fff}.editor{display:none}.editor.on{display:block}.gallery.off{display:none}.previewWrap{position:sticky;top:0;background:#101010;z-index:3;padding:12px 0 10px}.preview{background:#202020;display:flex;align-items:center;justify-content:center;max-height:49vh;min-height:170px;overflow:hidden}.preview canvas{display:block;max-width:100%;max-height:49vh;width:auto;height:auto;object-fit:contain}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center}.control{margin:16px 0}.control label{display:flex;justify-content:space-between;color:#bbb;font-size:11px;margin-bottom:9px}.control input{width:100%;accent-color:#fff}.control select{background:#202020;color:#fff;border:1px solid #666;width:100%;padding:11px}.seg{display:flex;gap:6px;margin:12px 0}.seg button{flex:1;border:1px solid #666;background:#1d1d1d;color:#eee;padding:11px 3px;font-size:10px}.seg button.chosen{background:#eee;color:#111}.note{border-top:1px solid #333;margin-top:26px;padding-top:15px}.status{font-size:11px;color:#bfbfbf;min-height:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.shell{padding-left:28px;padding-right:28px}.preview,.preview canvas{max-height:55vh}}
</style></head><body><main class="shell"><header><div><h1>ANALOG IMAGE<br>PROCESSOR</h1><div class="sub">WEB EDITION / V5</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end"><button class="tag langToggle" id="language" type="button" style="background:transparent;color:#eee;cursor:pointer">日本語 / EN</button><div class="tag" data-i18n="local">LOCAL PROCESSING</div></div></header><section class="gallery" id="gallery"><div class="upload"><label class="filebtn"><span data-i18n="open">+ OPEN IMAGE</span><input type="file" id="file" accept="image/*"></label><span class="sub" id="imageState">写真を選択してください</span></div><h2 data-i18n="select">SELECT EFFECT</h2><div class="grid" id="cards"></div><p class="sub note">SwiftUI版v35を参照して機能移植中です。未移植の設定や計算式があり、完全一致は未検証です。写真はサーバーへ送信しません。</p></section><section class="editor" id="editor"><div class="toolbar"><button class="btn secondary" id="back" data-i18n="gallery">← GALLERY</button><span class="sub" id="effectTitle"></span></div><div class="previewWrap"><div class="preview"><canvas id="output"></canvas></div><div class="status" id="status"></div></div><div id="styleBlock" hidden><h2 data-i18n="style">STYLE</h2><div class="seg" id="styles"></div><h2 data-i18n="preset">PRESET</h2><select id="stylePreset" class="btn secondary" style="width:100%;text-align:left"></select></div><h2 data-i18n="adjustments">ADJUSTMENTS</h2><div id="controls"></div><div class="actions"><button class="btn" id="save" data-i18n="save">SAVE IMAGE</button><button class="btn secondary" id="reset" data-i18n="reset">RESET</button><label class="btn secondary"><span data-i18n="change">CHANGE PHOTO</span><input type="file" id="replace" accept="image/*" hidden></label></div><p class="sub note">画像は端末内で処理されます。iPhoneではSAVE IMAGEから共有・写真に保存を選択してください。高解像度の画像では処理に時間がかかる場合があります。</p></section></main><script src="./effects.js?v=5"></script><script>
const UI={en:{local:'LOCAL PROCESSING',open:'+ OPEN IMAGE',select:'SELECT EFFECT',gallery:'← GALLERY',style:'STYLE',preset:'PRESET',adjustments:'ADJUSTMENTS',save:'SAVE IMAGE',reset:'RESET',change:'CHANGE PHOTO',choose:'Choose a photo',error:'Unable to open image',processing:'PROCESSING…',preview:'PREVIEW',original:'ORIGINAL',direction:'DIRECTION',curve:'CURVE'},ja:{local:'端末内で画像処理',open:'+ 写真を開く',select:'エフェクトを選択',gallery:'← ギャラリー',style:'スタイル',preset:'プリセット',adjustments:'調整項目',save:'画像を保存',reset:'初期設定に戻す',change:'写真を変更',choose:'写真を選択してください',error:'画像を読み込めませんでした',processing:'処理中…',preview:'プレビュー',original:'元画像',direction:'歪みの方向',curve:'曲線の強さ'}};
const LABEL_JA={threshold:'しきい値',scale:'ドットの大きさ',pattern:'パターン',color:'色',greenIntensity:'緑の強さ',gain:'増幅',contrast:'コントラスト',grain:'粒子',grainSize:'粒子サイズ',grainDensity:'粒子密度',glow:'発光',scope:'スコープ',scopeSize:'スコープサイズ',edgeSoftness:'輪郭のぼかし',crosshair:'照準',zoom:'ズーム',brightness:'明るさ',scanlines:'走査線',pixelGrid:'ピクセル格子',chromaticShift:'色ずれ',curvature:'湾曲',bloom:'光のにじみ',noise:'ノイズ',frame:'フレーム',exposure:'露出',saturation:'彩度',temperature:'色温度',haze:'霧',blur:'ぼかし',fade:'退色',vignette:'周辺減光',greenBoost:'緑の強調',skyBlue:'空の青',nostalgia:'ノスタルジー',fluorescent:'蛍光灯',unevenLight:'照明のムラ',yellowCast:'黄色の色かぶり',void:'空虚感',unrealLight:'非現実的な光',palette:'配色',dotSize:'ドットサイズ',inkDensity:'インク濃度',misregistration:'版ずれ',paper:'紙の明るさ',minimumArea:'最小領域',lineWidth:'線幅',opacity:'不透明度',monochrome:'モノクロ',showBoxes:'枠を表示',showCenters:'中心を表示',detectDark:'暗部を検出',showCoordinates:'座標を表示',showEdges:'接続線を表示',edgeDensity:'接続線の密度',intensity:'強度',blockSize:'ブロックサイズ',smear:'引き伸ばし',density:'密度',seed:'ランダム配置',waveDistortion:'波状の歪み',waveScale:'波の細かさ',verticalTrails:'縦方向の引き伸ばし',blockScatter:'ブロックの散乱',greenBleed:'緑のにじみ',characterSet:'文字セット',background:'背景',characterSize:'文字サイズ',fontWeight:'文字の太さ',spacing:'文字間隔',invert:'反転',gamma:'ガンマ',halation:'ハレーション',lightLeak:'光漏れ',polygonSize:'ポリゴンサイズ',edgeSensitivity:'輪郭感度',irregularity:'不規則さ',colorSimplification:'色数の簡略化',outline:'輪郭線',colorMode:'色モード',frequency:'周波数',angle:'角度',inkSpread:'インクの広がり',paperColor:'紙の色',tracking:'トラッキング',colorBleed:'色のにじみ',tapeNoise:'テープノイズ',dropout:'信号欠落',headSwitching:'画面下部の乱れ',softness:'柔らかさ',tapeAge:'テープの経年劣化',projection:'投影方式',direction:'歪みの方向',curve:'曲線の強さ',distortion:'歪みの強さ',fieldOfView:'画角',centerX:'中心 X',centerY:'中心 Y',chromaticAberration:'色収差'};
const VALUE_JA={'FULL FRAME':'全画面','CIRCULAR':'円形','BULGE':'外向き（膨張）','PINCH':'内向き（収縮）','BLACK':'黒','WHITE':'白','GREEN':'緑','MONOCHROME':'モノクロ','ORIGINAL':'元の色','ORIGINAL COLOR':'元の色','DREAMCORE':'ドリームコア','BACKROOMS':'バックルーム','LIMINAL SPACE':'リミナルスペース'};
let language=localStorage.getItem('analog-lang')==='ja'?'ja':'en';
const tr=k=>UI[language][k]||k;const displayValue=v=>language==='ja'?(VALUE_JA[v]||v):v;
function updateLanguage(){document.documentElement.lang=language;$('language').textContent=language==='ja'?'ENGLISH / 日本語':'日本語 / EN';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));if(!original)$('imageState').textContent=tr('choose');if($('editor').classList.contains('on'))makeControls();}
$('language').onclick=()=>{language=language==='en'?'ja':'en';localStorage.setItem('analog-lang',language);updateLanguage()};
const $=id=>document.getElementById(id),canvas=$('output'),thumbs=[];let original=null,current=0,style='DREAMCORE',preset='',values={},state={},renderTimer=null;const defaults=i=>Object.fromEntries(Object.entries(config[i]).map(([k,s])=>[k,Array.isArray(s)&&typeof s[0]==='number'?s[0]:s[0]]));
function renderCards(){let host=$('cards');host.replaceChildren();names.forEach((name,i)=>{let b=document.createElement('button');b.className='effect';b.innerHTML=`<div class="thumb"><canvas width="224" height="176"></canvas></div><div class="name"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${name}</span></div>`;b.onclick=()=>openEffect(i);host.appendChild(b);thumbs[i]=b.querySelector('canvas')});updateThumbs()}
function loadFile(file){if(!file)return;let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{original=make(im.naturalWidth,im.naturalHeight);original.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(url);$('imageState').textContent=`${file.name} · ${im.naturalWidth} × ${im.naturalHeight}`;updateThumbs();if($('editor').classList.contains('on'))render()};im.onerror=()=>{URL.revokeObjectURL(url);alert(tr('error'))};im.src=url}
$('file').onchange=e=>loadFile(e.target.files[0]);$('replace').onchange=e=>loadFile(e.target.files[0]);
function openEffect(i){if(!original){$('file').click();return}current=i;values=state[i]?{...state[i].values}:defaults(i);style=state[i]?.style||'DREAMCORE';preset=state[i]?.preset||stylePresets[style][0];$('gallery').classList.add('off');$('editor').classList.add('on');$('effectTitle').textContent=names[i];$('styleBlock').hidden=i!==3;makeControls();render();scrollTo(0,0)}
$('back').onclick=()=>{$('gallery').classList.remove('off');$('editor').classList.remove('on');updateThumbs()};$('reset').onclick=()=>{values=defaults(current);preset=stylePresets[style][0];makeControls();render()};
function makeControls(){let host=$('controls');host.replaceChildren();for(let [key,spec] of Object.entries(config[current])){if(current===3){let onlyDream=['greenBoost','skyBlue','nostalgia'],onlyBack=['fluorescent','unevenLight','yellowCast'],onlyLiminal=['void','unrealLight'];if((onlyDream.includes(key)&&style!=='DREAMCORE')||(onlyBack.includes(key)&&style!=='BACKROOMS')||(onlyLiminal.includes(key)&&style!=='LIMINAL SPACE'))continue}let wrap=document.createElement('div');wrap.className='control';let lab=document.createElement('label');lab.textContent=language==='ja'?(LABEL_JA[key]||key):key.replace(/([A-Z])/g,' $1').toUpperCase();if(typeof spec[0]==='string'){let sel=document.createElement('select');spec.forEach(x=>{let opt=document.createElement('option');opt.value=x;opt.textContent=displayValue(x);sel.appendChild(opt)});sel.value=values[key];sel.onchange=()=>{values[key]=sel.value;requestRender()};wrap.append(lab,sel)}else{let span=document.createElement('span');span.textContent=values[key];lab.appendChild(span);let inp=document.createElement('input');inp.type='range';inp.min=spec[1];inp.max=spec[2];inp.step=spec[3]||1;inp.value=values[key];inp.oninput=()=>{values[key]=Number(inp.value);span.textContent=inp.value;requestRender()};wrap.append(lab,inp)}host.appendChild(wrap)}let st=$('styles');st.replaceChildren();styles.forEach(x=>{let b=document.createElement('button');b.textContent=displayValue(x);b.className=x===style?'chosen':'';b.onclick=()=>{style=x;preset=stylePresets[x][0];makeControls();requestRender()};st.appendChild(b)});let sel=$('stylePreset');sel.replaceChildren();stylePresets[style].forEach(x=>{let opt=document.createElement('option');opt.value=x;opt.textContent=displayValue(x);sel.appendChild(opt)});if(!stylePresets[style].includes(preset))preset=stylePresets[style][0];sel.value=preset;sel.onchange=()=>{preset=sel.value;requestRender()}}
function requestRender(){clearTimeout(renderTimer);renderTimer=setTimeout(render,75)}
function render(){if(!original)return;state[current]={values:{...values},style,preset};let scale=Math.min(1,1100/Math.max(original.width,original.height)),w=Math.max(1,Math.round(original.width*scale)),h=Math.max(1,Math.round(original.height*scale)),src=make(w,h);src.getContext('2d').drawImage(original,0,0,w,h);try{let res=effect(src,current,values,style,preset);canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(res,0,0);$('status').textContent=`${tr('preview')} ${w} × ${h} · ${tr('original')} ${original.width} × ${original.height}`}catch(err){$('status').textContent='RENDER ERROR: '+err.message;console.error(err)}}
function updateThumbs(){thumbs.forEach((c,i)=>{let t=c.getContext('2d');t.fillStyle='#222';t.fillRect(0,0,c.width,c.height);if(!original)return;let scale=Math.max(c.width/original.width,c.height/original.height),w=original.width*scale,h=original.height*scale;t.drawImage(original,(c.width-w)/2,(c.height-h)/2,w,h);try{let rendered=effect(c,i,state[i]?.values||defaults(i),state[i]?.style||'DREAMCORE',state[i]?.preset||'');t.clearRect(0,0,c.width,c.height);t.drawImage(rendered,0,0)}catch(err){console.warn(names[i],err)}})}
$('save').onclick=async()=>{if(!original)return;let btn=$('save');btn.disabled=true;btn.textContent=tr('processing');await new Promise(r=>setTimeout(r,30));try{let w=original.width,h=original.height,limit=3200,scale=Math.min(1,limit/Math.max(w,h)),src=make(Math.round(w*scale),Math.round(h*scale));src.getContext('2d').drawImage(original,0,0,src.width,src.height);let res=effect(src,current,values,style,preset);let blob=await new Promise(resolve=>res.toBlob(resolve,'image/png'));if(!blob)throw Error('PNGの作成に失敗');let file=new File([blob],'analog-image.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Analog Image Processor'});return}catch(e){if(e.name==='AbortError')return}}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='analog-image.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){alert('保存に失敗しました: '+e.message)}finally{btn.disabled=false;btn.textContent=tr('save')}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));renderCards();updateLanguage();
</script></body></html>
