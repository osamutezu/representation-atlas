sequences</strong> — Previously invisible phases of movement become comparable</li><li><strong>Railway time-distance graph</strong> — Speed and meetings become line slopes and intersections</li><li><strong>Hermann Minkowski — Spacetime diagram</strong> — Temporal and spatial relations can be compared</li><li><strong>Henri Bergson — Duration</strong> — Experience need not be reduced to metric time</li><li><strong>Gilles Deleuze — Time-image</strong> — Temporal experience becomes an independent analytic dimension</li><li><strong>Christian Marclay — The Clock</strong> — Represented and lived time coincide</li><li><strong>Hiroshi Sugimoto — Theaters</strong> — Duration condenses into a single image</li><li><strong>Harold Edgerton — Stroboscopic photography</strong> — High-speed action becomes analyzable</li><li><strong>Hovmöller diagram</strong> — Propagation and movement appear as bands</li><li><strong>Buckminster Fuller — Dymaxion Map</strong> — World adjacency can be seen with different interruptions</li><li><strong>Kevin Lynch — The Image of the City</strong> — Mental structure of a city becomes describable</li><li><strong>Bill Hillier and Julienne Hanson — Space Syntax</strong> — Relational structure can be quantified</li><li><strong>Isovist</strong> — Visual reach and occlusion become measurable</li><li><strong>Voronoi diagram</strong> — Zones of proximity become explicit</li><li><strong>Delaunay triangulation</strong> — Local adjacency becomes a network</li><li><strong>Cartogram</strong> — Importance replaces literal size</li><li><strong>Conformal mapping</strong> — Curved surfaces can be reparameterized</li><li><strong>Medial axis / skeletonization</strong> — Underlying spatial branching becomes legible</li><li><strong>Persistent homology</strong> — Stable topological features emerge</li><li><strong>Ernst Chladni — Chladni figures</strong> — Invisible vibration modes form patterns</li><li><strong>Schlieren photography</strong> — Airflow and heat plumes become visible</li><li><strong>Michael Faraday — Magnetic field lines</strong> — Invisible force becomes spatial structure</li><li><strong>Cloud chamber</strong> — Transient invisible trajectories are recorded</li><li><strong>Particle image velocimetry</strong> — Flow structure becomes measurable</li><li><strong>Thermography</strong> — Thermal differences become spatially legible</li><li><strong>Spectrogram</strong> — Acoustic structure becomes visible</li><li><strong>Seismogram</strong> — Small oscillations become analyzable</li><li><strong>EEG topographic mapping</strong> — Spatial patterns in recordings become visible</li><li><strong>Cosmic microwave background map</strong> — Large-scale cosmic patterns emerge</li><li><strong>Santiago Ramón y Cajal — Neuron drawings</strong> — Neural morphology and connection patterns become intelligible</li><li><strong>Mark Lombardi — Narrative Structures</strong> — Complex power and finance relationships become legible</li><li><strong>Richard Feynman — Feynman diagrams</strong> — Complex calculations gain compact visual notation</li><li><strong>Phylogenetic tree</strong> — Shared ancestry becomes legible</li><li><strong>Food web</strong> — Interdependence becomes visible</li><li><strong>Dependency graph</strong> — Critical dependencies become visible</li><li><strong>Chord diagram</strong> — Reciprocal exchange becomes comparable</li><li><strong>Adjacency matrix</strong> — Connectivity can be compared independently of layout</li><li><strong>Hypergraph</strong> — Group interactions cannot be reduced to pairwise links</li><li><strong>Knowledge graph</strong> — Cross-domain knowledge becomes navigable</li><li><strong>Charles and Ray Eames — Powers of Ten</strong> — Micro and macro phenomena form a continuous narrative</li><li><strong>Benoit Mandelbrot — Fractal geometry</strong> — Cross-scale structure becomes intelligible</li><li><strong>Hilbert curve</strong> — Linear order can cover a two-dimensional domain</li><li><strong>Peano curve</strong> — Dimension and continuity relations become surprising</li><li><strong>Quadtree / Octree</strong> — Variable resolution represents complexity efficiently</li><li><strong>Wavelet transform</strong> — Global and local variations can be studied together</li><li><strong>Fourier transform</strong> — Hidden cycles become identifiable</li><li><strong>t-SNE / UMAP</strong> — Patterns of similarity become inspectable</li><li><strong>Parallel coordinates</strong> — Multivariate tradeoffs become comparable</li><li><strong>Tensor field visualization</strong> — Anisotropic behavior becomes visible</li><li><strong>Man Ray — Rayograph</strong> — Objects leave indexical light traces</li><li><strong>Hans Haacke — Condensation Cube</strong> — Artwork becomes a changing environmental record</li><li><strong>Diller + Scofidio — Blur Building</strong> — Architectural boundaries become atmospheric</li><li><strong>Cyanotype</strong> — Light conditions directly produce drawings</li><li><strong>Frottage</strong> — Material relief becomes a graphic trace</li><li><strong>Kirlian photography</strong> — Interaction with apparatus becomes visible</li><li><strong>Lichtenberg figure</strong> — Energy propagation leaves geometric marks</li><li><strong>Dendrochronology</strong> — Material growth becomes an environmental archive</li><li><strong>Ice core stratigraphy</strong> — Past climate becomes a material section</li><li><strong>Palimpsest</strong> — History survives through partial erasure</li><li><strong>Gordon Cullen — Serial Vision</strong> — Changing visual experience becomes design material</li><li><strong>Guy Debord — The Naked City</strong> — Psychological urban links displace metric proximity</li><li><strong>Bernard Tschumi — The Manhattan Transcripts</strong> — Architecture includes events as well as objects</li><li><strong>Lawrence Halprin — RSVP Cycles</strong> — Process itself becomes representable</li><li><strong>Kevin Warwick — Sensory augmentation research</strong> — Human perception can be extended</li><li><strong>Jakob von Uexküll — Umwelt</strong> — Different creatures inhabit different perceptual worlds</li><li><strong>Echolocation</strong> — Space is perceived acoustically</li><li><strong>Optic flow</strong> — Self-motion and depth cues become legible</li><li><strong>Eye-tracking heatmap</strong> — Attention distribution becomes visible</li><li><strong>James J. Gibson — Affordance</strong> — Functional opportunities replace object labels</li><li><strong>Monte Carlo simulation</strong> — Possible results become distributions</li><li><strong>Ensemble forecast visualization</strong> — Uncertainty and divergence become legible</li><li><strong>Phase portrait</strong> — Behavior and attractors become visible</li><li><strong>Bifurcation diagram</strong> — Thresholds and regime shifts emerge</li><li><strong>Cellular automata</strong> — Complex patterns emerge from simple rules</li><li><strong>Reaction-diffusion system</strong> — Stripes and spots can emerge</li><li><strong>L-system</strong> — Branching growth structures can be generated</li><li><strong>Markov chain</strong> — Sequences of use become estimable</li><li><strong>Bayesian network</strong> — Beliefs can update with evidence</li><li><strong>Pareto front</strong> — Tradeoffs replace a single optimum</li><li><strong>Iannis Xenakis — Metastaseis</strong> — Music and architecture share formal structures</li><li><strong>John Cage — Fontana Mix</strong> — Score becomes a combinatorial system</li><li><strong>Sol LeWitt — Wall Drawings</strong> — Artwork becomes a rule rather than one fixed image</li><li><strong>Cedric Price — Fun Palace</strong> — Change becomes architectural content</li><li><strong>Yona Friedman — Spatial City</strong> — Architecture becomes a field of possibilities</li><li><strong>Archigram — Plug-In City</strong> — Replacement and lifecycle become explicit</li><li><strong>Nicholas Negroponte — Architecture Machine</strong> — Drawing becomes responsive process</li><li><strong>Digital twin</strong> — Representations evolve with measured conditions</li><li><strong>Data physicalization</strong> — Information can be physically experienced</li><li><strong>Sonification</strong> — Nonvisual patterns become perceptible</li><li><strong>フンボルト《カナリア諸島の自然図》</strong> — 異なる山地を同じ高度軸で比較できる</li><li><strong>フンボルトの等温線図</strong> — 政治的境界と異なる気候の連続性が現れる</li><li><strong>フンボルト《植物地理学の概略》</strong> — 個体の記録から植生帯の比較へ</li><li><strong>ダーウィンのサンゴ礁形成図</strong> — 現在の形態から不可視の形成史を推定</li><li><strong>ウィリアム・スミスの地質図</strong> — 地表から地下構造と形成史を読み解く</li><li><strong>パトリック・ゲデス《Valley Section》</strong> — 自然と社会の相互依存が一望できる</li><li><strong>C・ハート・メリアムの生命帯</strong> — 異なる地理条件における生物分布を比較</li><li><strong>ホールドリッジの生命帯分類</strong> — 生態系の成立条件を組合せとして示す</li><li><strong>ウィテカーのバイオーム図</strong> — 生態系を地理的位置ではなく成立条件で比較</li><li><strong>ヴァルター＝リースの気候図</strong> — 乾湿期と季節的な環境変化が読める</li><li><strong>ケッペン＝ガイガー気候区分</strong> — 気候の差異と類似性を一枚の地図で比較</li><li><strong>生態学的トランセクト</strong> — 環境条件の変化と生物分布の関係が見える</li><li><strong>エコトーン（生態系移行帯）</strong> — 境界の幅と相互作用が現れる</li><li><strong>種分布モデル</strong> — 現在と将来の生息可能性が見える</li><li><strong>海洋の水温躍層・密度成層</strong> — 不可視の水塊境界が見える</li><li><strong>土壌断面・土壌層位</strong> — 物質の蓄積と環境の履歴が分かる</li><li><strong>地質柱状図・層序図</strong> — 地層から形成史と環境変化を復元</li><li><strong>ジョン・B・スパークス《Histomap》</strong> — 勢力の盛衰と並存が連続的に読める</li><li><strong>時間–温度–変態図（TTT図）</strong> — 材料状態の分岐条件が分かる</li><li><strong>ヘーゲルストランドの時間地理学</strong> — 移動可能性と行為の制約が見える</li><li><strong>ダーシー・トンプソン《On Growth and Form》</strong> — 形態の差を共通の変換規則で理解</li><li><strong>ワディントンのエピジェネティック・ランドスケープ</strong> — 抽象的な分化過程を直感的に理解できる</li><li><strong>ルネ・トムのカタストロフィー理論</strong> — 小さな変化が大きな転換を生む境界が分かる</li><li><strong>フィリップ・ラームの気候的建築図</strong> — 形態と微気候の相互構成が読める</li></ol></main></noscript><div class="atlas-lang" role="group" aria-label="Language / 言語"><button type="button" data-lang="ja" aria-pressed="true">日本語</button><button type="button" data-lang="en" aria-pressed="false">English</button></div><script src="i18n.js"></script><script>

function showAtlas(){document.querySelector('#content').innerHTML=`<section class="hero"><div class="eyebrow">A RESEARCH INDEX OF REPRESENTATIONAL SYSTEMS</div><h1>Representation<br>Atlas<span style="color:#6e9b91">.</span></h1><p>地図・科学・芸術・建築・生物・計算を横断する124事例。10ジャンルと表現原理から探索する。各カードはWikimedia Commonsの関連図版候補を取得します（画像の作品同定は未検証）。</p><div class="stats"><div><b>124</b>PRECEDENTS</div><div><b>10</b>GENRES</div><div><b>10</b>MECHANISMS</div></div></section><div class="section-title"><h2>01 / フンボルト的表現の50系譜</h2><small>NEW RESEARCH COLLECTION · 50 REFERENCES / 24 NEW</small></div><p class="research-intro">フンボルトの《Naturgemälde》を起点に、環境断面・条件分布・多変量統合・時間・不可視現象・生成・関係・経験の8系統で探索。既存26事例は統合済みです。</p><div class="humboldt-grid">${humboldtTiles()}</div><div class="section-title"><h2>02 / ジャンルから探索</h2><small>SELECT A GENRE</small></div><div class="genre-grid">${genreTiles()}</div><div class="section-title"><h2>03 / 事例アーカイブ</h2><small>IMAGE-LED INDEX</small></div><div class="toolbar"><input id="q" placeholder="作品名・現象・原理を検索" value="${esc(state.q)}"><select id="mechanism"><option value="">すべての表現原理</option>${MECHS.map(m=>`<option value="${m.id}" ${state.mechanism===m.id?'selected':''}>${esc(m.label_ja)}</option>`).join('')}</select><button class="action" id="clear">絞り込みを解除</button></div><div class="note">画像はWikimedia Commonsから自動取得した<strong>参考候補</strong>です。必ずしも作品の原図とは限りません。各事例の詳細から出典を確認し、正しい図版URLに差し替えられます。ネット接続がない場合も124事例の文章データは表示されます。</div><div class="count" id="count"></div><div class="cards" id="cards"></div><div class="foot">Representation Atlas · Educational research prototype · Images remain property of their respective rights holders.</div>`;document.querySelectorAll('[data-humboldt]').forEach(b=>b.onclick=()=>{state.humboldt=state.humboldt===b.dataset.humboldt?'':b.dataset.humboldt;state.category='';showAtlas();document.querySelector('#cards')?.scrollIntoView({behavior:'smooth',block:'start'})});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.category=state.category===b.dataset.cat?'':b.dataset.cat;state.humboldt='';showAtlas()});document.querySelector('#q').oninput=e=>{state.q=e.target.value;drawCards()};document.querySelector('#mechanism').onchange=e=>{state.mechanism=e.target.value;drawCards()};document.querySelector('#clear').onclick=()=>{state.category='';state.q='';state.mechanism='';state.humboldt='';showAtlas()};drawCards()}
function drawCards(){const list=filtered();document.querySelector('#count').textContent=`${list.length} / ${DATA.precedents.length} CASES · ${state.humboldt?'HUMBOLDT COLLECTION':state.category?catBy(state.category).label_ja:'ALL GENRES'}`;document.querySelector('#cards').innerHTML=list.map(card).join('');document.querySelectorAll('[data-open]').forEach(x=>x.onclick=e=>{if(!e.target.closest('a'))openCase(x.dataset.open)});observe()}
function openCase(id){const c=DATA.precedents.find(x=>x.id===id);if(!c)return;const info=manual[id]||stored[id];const imageHtml=info?.url?`<img class="modal-photo" src="${esc(info.url)}" alt="${esc(c.name)} の関連図版候補">`:`<div class="modal-photo" style="display:grid;place-items:center;color:#667">画像未取得 / Commonsで検索してください</div>`;const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal"><button class="modal-close" id="close">閉じる ×</button><div class="modal-inner"><div class="eyebrow">CASE ${esc(c.id)} / ${esc(catBy(c.category_id).label_en)}</div><h2>${esc(c.name_ja||c.name)}</h2>${imageHtml}<div class="credit">${info?`候補画像: ${esc(info.title||'手動登録')} · ${esc(info.artist||'作者未確認')} · ${esc(info.license||'ライセンス要確認')} ${info.source?`· <a class="link" target="_blank" rel="noopener" href="${esc(info.source)}">Commonsの画像詳細</a>`:''}`:'図版の登録なし'}<br>画像と作品の対応・著作権は必ず原資料で確認してください。</div><p><a class="link" href="https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(queryFor(c))}&title=Special:MediaSearch&type=image" target="_blank" rel="noopener">Wikimedia Commonsで関連図版を探す ↗</a></p><div class="detail-grid"><div class="detail-panel"><small>INPUT / 入力情報</small><p>${esc(c.inputs)}</p></div><div class="detail-panel"><small>TRANSFORMATION / 変換規則</small><p>${esc(c.transformation_rule)}</p></div><div class="detail-panel"><small>NEW KNOWLEDGE / 獲得する情報</small><p>${esc(c.new_knowledge)}</p></div><div class="detail-panel"><small>ARCHITECTURAL TRANSFER / 建築への転用</small><p>${esc(c.architectural_transfer)}</p></div></div><p><span class="pill">${esc(catBy(c.category_id).label_ja)}</span>${c.mechanism_ids.map(x=>`<span class="pill">${esc(MECHS.find(m=>m.id===x)?.label_ja||x)}</span>`).join('')}</p><div class="note"><b>図版を訂正・登録</b><p>Commonsで画像を確認した後、画像ファイルのURLを登録できます。このiPhone／ブラウザ内に保存されます。</p><input id="manual-url" style="width:100%;padding:11px;border:1px solid #cbd4d0;border-radius:7px" placeholder="https://... 画像URL" value="${esc(manual[id]?.url||'')}"><button class="action" id="save-img" style="margin-top:9px">画像URLを保存</button><button class="action" id="reset-img" style="margin-top:9px">自動候補に戻す</button></div></div></div>`;document.body.appendChild(m);const close=()=>m.remove();m.querySelector('#close').onclick=close;m.onclick=e=>{if(e.target===m)close()};m.querySelector('#save-img').onclick=()=>{const url=m.querySelector('#manual-url').value.trim();if(!/^https:\/\//.test(url)){alert('https:// で始まる画像URLを入力してください');return}manual[id]={url,title:'手動登録画像',source:url,reviewed:true};localStorage.setItem('atlas-manual-images-v2',JSON.stringify(manual));close();showAtlas()};m.querySelector('#reset-img').onclick=()=>{delete manual[id];localStorage.setItem('atlas-manual-images-v2',JSON.stringify(manual));close();showAtlas()}}
function showMechanisms(){document.querySelector('#content').innerHTML=`<section class="hero"><div class="eyebrow">TRANSFORMATION TAXONOMY</div><h1>Mechanisms<span style="color:#6e9b91">.</span></h1><p>ジャンルは事例の領域、原理は情報を変換する操作。同じ原理を異なる領域から横断検索できます。</p></section><div class="genre-grid" style="margin-top:26px">${MECHS.map((m,i)=>`<button class="genre" data-mech="${m.id}"><div class="genre-art">${graphic(i)}</div><div class="genre-text"><b>${esc(m.label_ja)}</b><small>${esc(m.description||'')}</small></div></button>`).join('')}</div>`;document.querySelectorAll('[data-mech]').forEach(x=>x.onclick=()=>{state.mechanism=x.dataset.mech;state.category='';state.view='atlas';render()})}
function showIdeas(){document.querySelector('#content').innerHTML=`<section class="hero"><div class="eyebrow">DESIGN TRANSFER LAB</div><h1>Idea Lab<span style="color:#6e9b91">.</span></h1><p>124事例から発展させた10の建築表現仮説。元事例をたどり、変換原理を比較する。</p></section><div style="margin-top:25px">${DATA.ideas.map((x,i)=>`<div class="idea"><div class="eyebrow">PROPOSAL ${String(i+1).padStart(2,'0')}</div><h3>${esc(x.title_ja||x.title||x.name||'Proposal')}</h3><p>${esc(x.description||x.concept||x.summary||JSON.stringify(x).slice(0,350))}</p></div>`).join('')}</div>`}
function render(){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===state.view));if(state.view==='atlas')showAtlas();else if(state.view==='mechanisms')showMechanisms();else showIdeas()}
document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>{state.view=x.dataset.nav;render();window.scrollTo({top:0,behavior:'smooth'})});render();

window.AtlasI18n.start();
</script></body></html>
